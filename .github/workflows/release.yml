name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: no-flashbang.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: no-flashbang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($version)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Pack the downloads
        run: |
          scripts/distribute.sh \
            --windows bin/x86_64-pc-windows-msvc/no-flashbang.exe \
            --linux bin/x86_64-unknown-linux-musl/no-flashbang

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
